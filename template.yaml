AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  rota-vital-guias-serverless

  Funcao serverless que recebe uma requisicao do Rota Vital e devolve a guia de transporte.

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

Resources:
  GuiaTransporteFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Events:
        GerarGuia:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /guias
            Method: post

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  GuiaTransporteApi:
    Description: "API Gateway endpoint URL for Prod stage for Guia de Transporte function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/guias/"
  GuiaTransporteFunction:
    Description: "Guia de Transporte Lambda Function ARN"
    Value: !GetAtt GuiaTransporteFunction.Arn
  GuiaTransporteFunctionIamRole:
    Description: "Implicit IAM Role created for Guia de Transporte function"
    Value: !GetAtt GuiaTransporteFunctionRole.Arn
